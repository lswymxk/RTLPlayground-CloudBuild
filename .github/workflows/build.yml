name: Build firmware

run-name: Build ${{ inputs.model }} / ${{ inputs.pcb }}

# 只支持手动触发：先选设备型号，再选 PCB 版本，点 Run workflow。
# 同一型号可能有多种 PCB；只会编译选中的那个 machine，其它机型不会编译。
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "固件仓库（owner/name）"
        required: true
        type: string
        default: logicog/RTLPlayground
      source_ref:
        description: "分支 / 标签 / commit SHA"
        required: true
        type: string
        default: main
      model:
        description: "选择设备型号"
        required: true
        type: choice
        default: "keepLiNK KP-9000-6XHML-X2"
        options:
          - "8+1 SFP Port Switch"
          - "Ampcom WAM902-SWTG018AS"
          - "Binardat 2G06-04210GSM"
          - "Davuaz Da-K6501W"
          - "DOTX DX-1009N"
          - "FOXNEO FNS-1200P"
          - "Goalake IG108"
          - "Goalake IG204"
          - "GoodTop GT-ST018M"
          - "GoodTop GT-ST024M"
          - "Guangnianwei 7018-2.5G"
          - "Hasivo S1100P-8GT-1SX-S"
          - "Hasivo S1100WP-8GT-1SX-SE"
          - "Hasivo S600W-4GT-2XGT-SE"
          - "Hisource Hi-K0402WS"
          - "Hisource Hi-K0801WS"
          - "Hongyavision HYWS-SGT0204S"
          - "Horaco HC-SWTG124AS"
          - "Horaco HC-SWTG218AS"
          - "Horaco HC-SWTGW218AS"
          - "Horaco ZX-SG4T2"
          - "Horaco ZX-SWTGW218AS"
          - "Horaco ZX310S-4T2XH"
          - "Horaco ZX310S-4T2XT"
          - "keepLink KP-9000-6XH-X"
          - "keepLiNK KP-9000-6XH-X2"
          - "keepLiNK KP-9000-6XHML-X2"
          - "keepLink KP-9000-9XH-X-EU"
          - "keepLiNK KP-9000-9XHML-X"
          - "keepLiNK KP-9000-9XHPML-X"
          - "Lianguo HYWS-SGT0108S"
          - "Lianguo ZX-SWTGW215AS"
          - "MokerLink 2G040210GSM"
          - "MokerLink 2G08110GSN"
          - "MokerLink POE-2G080110GS"
          - "MokerLink ZX-SWTGW218AS"
          - "PCB-SWTG024AS-A-2.0.1"
          - "RealHD PSW8-25MG"
          - "Ruiying RY-4GT-2SX"
          - "Ruiying RY-8GT-1SX"
          - "SIRIVISION S25G2206FP V1.1"
          - "Sirivision SR-S25G2109F"
          - "Sodola SL-SWTGW215AS-D"
          - "Sodola SL902-SWTGW124AS"
          - "Sodola SL902-SWTGW215AS"
          - "Steamemo IG204 V1"
          - "SWGT024 V2.0 Managed"
          - "SWGT024 V2.0 Unmanaged"
          - "SWTG018AS-A V2.0"
          - "SWTG024AS-A-V2.0.1-5C-1SFP"
          - "SWTG024AS-V2.0"
          - "SWTG024AS-V2.1.0"
          - "Trendnet TEG-S562"
          - "XikeStor SKS3200-8E1X"
          - "XikeStor SKS3200M-8GPY1XF"
          - "YuanLey YS25-0402"
          - "YuanLey YS25-0402M"
          - "ZoeRax HG0402XG"
      pcb:
        description: "选择 PCB 版本；该型号只有一种 PCB 时选 AUTO（多 PCB 型号必须选具体版本）"
        required: true
        type: choice
        default: "AUTO"
        options:
          - "AUTO"
          - "2M_PCB23_V2_2"
          - "2M_PCB23_V3_1"
          - "2M_PCB23_V3_2"
          - "2M_PCB43_V1_1"
          - "2M_PCB43_V1_2"
          - "2M_PCB43_V2_1"
          - "PCB_K0402W_V2_0"
          - "PCB_K0402W_V3_0"
      custom_machine:
        description: "高级：直接填 machine 文件名（会忽略上面的型号/PCB，一般留空）"
        required: false
        type: string
        default: ""
      config_file:
        description: "自定义启动配置文件；留空则自动用 configs/<machine>.txt，再否则用源码 config.txt"
        required: false
        type: string
        default: ""
      build_oem:
        description: "同时构建 OEM 网页升级包"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "发布到 Release 的标签，例如 v0.1.0；留空则只上传 Artifact"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: rtlplayground-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.model }} / ${{ inputs.pcb }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout builder
        uses: actions/checkout@v6

      - name: Checkout firmware source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: src

      # 根据 型号 + PCB 在 machines.tsv 里查出 machine 文件名；提前校验，避免白等编译
      - name: Resolve machine
        id: resolve
        env:
          IN_MODEL: ${{ inputs.model }}
          IN_PCB: ${{ inputs.pcb }}
          IN_CUSTOM_MACHINE: ${{ inputs.custom_machine }}
        run: |
          set -euo pipefail
          machine="$IN_CUSTOM_MACHINE"
          if [ -z "$machine" ]; then
            if [ ! -f machines.tsv ]; then
              echo "缺少 machines.tsv，请确认它和 workflow 一起上传了" >&2
              exit 1
            fi
            mapfile -t rows < <(awk -F '\t' -v model="$IN_MODEL" '$0 !~ /^#/ && $2 == model {print $1 "\t" $3}' machines.tsv)
            count="${#rows[@]}"
            if [ "$count" -eq 0 ]; then
              echo "machines.tsv 里没有型号：$IN_MODEL" >&2
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              machine="$(printf '%s\n' "${rows[0]}" | cut -f1)"
              actual_pcb="$(printf '%s\n' "${rows[0]}" | cut -f2)"
              if [ "$IN_PCB" != "AUTO" ] && [ "$IN_PCB" != "$actual_pcb" ]; then
                echo "提示：$IN_MODEL 只有一种 PCB（$actual_pcb），已忽略所选的 $IN_PCB" >&2
              fi
            else
              if [ "$IN_PCB" = "AUTO" ]; then
                echo "型号 $IN_MODEL 有多个 PCB，请在 pcb 下拉框里选择具体版本：" >&2
                printf '%s\n' "${rows[@]}" | cut -f2 | sed 's/^/  /' >&2
                exit 1
              fi
              machine="$(printf '%s\n' "${rows[@]}" | awk -F '\t' -v pcb="$IN_PCB" '$2 == pcb {print $1; exit}')"
              if [ -z "$machine" ]; then
                echo "型号 $IN_MODEL 没有 PCB $IN_PCB；可选：" >&2
                printf '%s\n' "${rows[@]}" | cut -f2 | sed 's/^/  /' >&2
                exit 1
              fi
            fi
          fi
          if ! [[ "$machine" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "非法 machine 名：$machine" >&2
            exit 1
          fi
          if [ ! -f "src/machine/$machine.h" ] || [ ! -f "src/machine/$machine.c" ]; then
            echo "源码里没有 machine：$machine" >&2
            exit 1
          fi
          echo "machine=$machine" >> "$GITHUB_OUTPUT"
          echo "本次只编译：\`$machine\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make gcc g++ pkg-config bison flex libboost-dev patch bzip2 curl \
            ca-certificates xxd python3 libjson-c-dev zlib1g-dev

      - name: Cache patched SDCC toolchain
        uses: actions/cache@v4
        with:
          path: src/toolchain
          key: sdcc-${{ runner.os }}-${{ hashFiles('src/sdcc/*') }}-v1

      # 如果上一次构建在编译 SDCC 时中断，缓存可能是不完整的；
      # 直接删掉让 make 重新构建，避免诡异的链接错误。
      - name: Verify cached SDCC
        run: |
          set -euo pipefail
          if compgen -G "src/toolchain/sdcc-*/bin/sdcc" > /dev/null; then
            echo "SDCC 工具链已就绪"
          else
            echo "缓存中没有完整的 SDCC 工具链，清理后重新编译"
            rm -rf src/toolchain
          fi

      - name: Build firmware
        env:
          MACHINE: ${{ steps.resolve.outputs.machine }}
          IN_CONFIG_FILE: ${{ inputs.config_file }}
          IN_BUILD_OEM: ${{ inputs.build_oem }}
          IN_SOURCE_REPO: ${{ inputs.source_repo }}
          IN_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          oem=0
          if [ "$IN_BUILD_OEM" = "true" ]; then oem=1; fi
          MACHINES="$MACHINE" \
          CONFIG_FILE="$IN_CONFIG_FILE" \
          OEM="$oem" \
          SOURCE_REPO="$IN_SOURCE_REPO" \
          SOURCE_REF="$IN_SOURCE_REF" \
          SRC_DIR=src DIST_DIR=dist CONFIG_DIR=configs \
          bash scripts/build.sh

      - name: Write job summary
        if: always()
        env:
          MODEL: ${{ inputs.model }}
          PCB: ${{ inputs.pcb }}
          MACHINE: ${{ steps.resolve.outputs.machine || inputs.custom_machine }}
          IN_CONFIG_FILE: ${{ inputs.config_file }}
          IN_SOURCE_REPO: ${{ inputs.source_repo }}
          IN_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          {
            echo "## RTLPlayground 固件构建"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 源码 | \`${IN_SOURCE_REPO}\` @ \`${IN_SOURCE_REF}\` |"
            echo "| 型号 | \`${MODEL}\` |"
            echo "| PCB | \`${PCB}\` |"
            echo "| 编译目标 | \`${MACHINE:-未解析}\` |"
            if [ -n "$MACHINE" ]; then
              echo "| 启动配置 | ${IN_CONFIG_FILE:-自动匹配 configs/${MACHINE}.txt 或源码 config.txt} |"
            fi
            echo ""
            if [ -f dist/build-info.txt ]; then
              echo '```'
              cat dist/build-info.txt
              echo '```'
            else
              echo "构建没有产生产物，请查看上面的日志。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtlplayground-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub release
        if: success() && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          MACHINE: ${{ steps.resolve.outputs.machine }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "release_tag 只能包含字母、数字、点、下划线、短横线和斜杠：$TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "RTLPlayground $TAG ($MACHINE)" \
              --notes-file dist/build-info.txt
          fi
